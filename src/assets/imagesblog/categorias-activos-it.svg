<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="hardwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="softwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>
  
  <!-- Divider lines -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1">
    <line x1="300" y1="20" x2="300" y2="380"/>
    <line x1="600" y1="20" x2="600" y2="380"/>
    <line x1="900" y1="20" x2="900" y2="380"/>
  </g>
  
  <!-- ==================== HARDWARE SECTION ==================== -->
  <g transform="translate(150, 70)">
    <!-- Icon container -->
    <rect x="-60" y="-40" width="120" height="120" rx="16" fill="url(#hardwareGrad)" opacity="0.15"/>
    
    <!-- Server rack -->
    <g transform="translate(-35, -25)">
      <rect width="70" height="80" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <rect x="5" y="10" width="60" height="12" rx="2" fill="#3b82f6" opacity="0.3"/>
      <rect x="5" y="28" width="60" height="12" rx="2" fill="#3b82f6" opacity="0.3"/>
      <rect x="5" y="46" width="60" height="12" rx="2" fill="#3b82f6" opacity="0.3"/>
      <!-- Status lights -->
      <circle cx="12" cy="16" r="3" fill="#3b82f6"/>
      <circle cx="12" cy="34" r="3" fill="#22c55e"/>
      <circle cx="12" cy="52" r="3" fill="#3b82f6"/>
      <!-- Vents -->
      <g stroke="#3b82f6" stroke-width="1" opacity="0.5">
        <line x1="25" y1="12" x2="60" y2="12"/>
        <line x1="25" y1="30" x2="60" y2="30"/>
        <line x1="25" y1="48" x2="60" y2="48"/>
      </g>
    </g>
    
    <!-- Laptop icon -->
    <g transform="translate(20, 35)">
      <rect width="35" height="25" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
      <rect x="2" y="2" width="31" height="18" fill="#60a5fa" opacity="0.2"/>
      <path d="M-5,25 L40,25 L35,32 L0,32 Z" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#60a5fa">Hardware</text>
    
    <!-- Description -->
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Servidores, equipos,</text>
    <text x="0" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">dispositivos de red</text>
    
    <!-- Tags -->
    <g transform="translate(0, 165)">
      <rect x="-40" y="0" width="80" height="20" rx="10" fill="#3b82f6" opacity="0.2"/>
      <text x="0" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#60a5fa">Serial, modelo</text>
    </g>
  </g>
  
  <!-- ==================== SOFTWARE SECTION ==================== -->
  <g transform="translate(450, 70)">
    <!-- Icon container -->
    <rect x="-60" y="-40" width="120" height="120" rx="16" fill="url(#softwareGrad)" opacity="0.15"/>
    
    <!-- Code/Apps icon -->
    <g transform="translate(-40, -30)">
      <!-- Monitor -->
      <rect width="80" height="55" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="5" y="5" width="70" height="42" fill="#8b5cf6" opacity="0.15"/>
      <rect x="30" y="55" width="20" height="5" fill="#8b5cf6"/>
      <rect x="20" y="60" width="40" height="3" rx="1" fill="#8b5cf6"/>
      
      <!-- Code brackets on screen -->
      <text x="20" y="30" font-family="monospace" font-size="14" fill="#a78bfa">&lt;/&gt;</text>
      <rect x="50" y="18" width="18" height="3" rx="1" fill="#22c55e"/>
      <rect x="50" y="25" width="12" height="3" rx="1" fill="#f59e0b"/>
    </g>
    
    <!-- App icons floating -->
    <g transform="translate(30, 40)">
      <rect width="28" height="28" rx="5" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="14" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">ERP</text>
    </g>
    
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#a78bfa">Software</text>
    
    <!-- Description -->
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Sistemas, aplicaciones,</text>
    <text x="0" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">bases de datos</text>
    
    <!-- Tags -->
    <g transform="translate(0, 165)">
      <rect x="-50" y="0" width="100" height="20" rx="10" fill="#8b5cf6" opacity="0.2"/>
      <text x="0" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a78bfa">Licencia, versión</text>
    </g>
  </g>
  
  <!-- ==================== CLOUD SECTION ==================== -->
  <g transform="translate(750, 70)">
    <!-- Icon container -->
    <rect x="-60" y="-40" width="120" height="120" rx="16" fill="url(#cloudGrad)" opacity="0.15"/>
    
    <!-- Main cloud -->
    <g transform="translate(-45, -35)">
      <path d="M25,55 Q0,55 0,38 Q0,20 18,20 Q20,5 40,5 Q60,5 65,20 Q80,18 82,35 Q82,55 60,55 Z" 
            fill="#06b6d4" opacity="0.25" stroke="#06b6d4" stroke-width="2"/>
      
      <!-- IaaS label -->
      <g transform="translate(8, 25)">
        <rect width="30" height="14" rx="3" fill="#06b6d4" opacity="0.4"/>
        <text x="15" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="white">IaaS</text>
      </g>
      
      <!-- PaaS label -->
      <g transform="translate(42, 25)">
        <rect width="30" height="14" rx="3" fill="#0891b2" opacity="0.6"/>
        <text x="15" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="white">PaaS</text>
      </g>
      
      <!-- SaaS label -->
      <g transform="translate(25, 42)">
        <rect width="30" height="14" rx="3" fill="#06b6d4"/>
        <text x="15" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="white">SaaS</text>
      </g>
    </g>
    
    <!-- Floating connection dots -->
    <circle cx="-50" cy="0" r="4" fill="#06b6d4" opacity="0.6"/>
    <circle cx="50" cy="-10" r="3" fill="#22d3ee" opacity="0.5"/>
    <circle cx="45" cy="30" r="5" fill="#06b6d4" opacity="0.4"/>
    
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#22d3ee">Nube</text>
    
    <!-- Description -->
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">IaaS, PaaS, SaaS</text>
    <text x="0" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Servicios cloud</text>
    
    <!-- Tags -->
    <g transform="translate(0, 165)">
      <rect x="-55" y="0" width="110" height="20" rx="10" fill="#06b6d4" opacity="0.2"/>
      <text x="0" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#22d3ee">Proveedor, consumo</text>
    </g>
  </g>
  
  <!-- ==================== DATA SECTION ==================== -->
  <g transform="translate(1050, 70)">
    <!-- Icon container -->
    <rect x="-60" y="-40" width="120" height="120" rx="16" fill="url(#dataGrad)" opacity="0.15"/>
    
    <!-- Database cylinder -->
    <g transform="translate(-35, -30)">
      <ellipse cx="35" cy="15" rx="30" ry="12" fill="none" stroke="#10b981" stroke-width="2"/>
      <path d="M5,15 L5,65 Q5,77 35,77 Q65,77 65,65 L65,15" fill="none" stroke="#10b981" stroke-width="2"/>
      <ellipse cx="35" cy="40" rx="30" ry="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="35" cy="65" rx="30" ry="12" fill="none" stroke="#10b981" stroke-width="2"/>
      
      <!-- Data rows -->
      <line x1="15" y1="25" x2="55" y2="25" stroke="#34d399" stroke-width="1" opacity="0.4"/>
      <line x1="15" y1="50" x2="55" y2="50" stroke="#34d399" stroke-width="1" opacity="0.4"/>
    </g>
    
    <!-- File icons -->
    <g transform="translate(25, -20)">
      <rect width="22" height="28" rx="3" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
      <path d="M15,0 L22,7 L15,7 Z" fill="#10b981" opacity="0.5"/>
      <line x1="5" y1="14" x2="17" y2="14" stroke="#10b981" stroke-width="1"/>
      <line x1="5" y1="19" x2="14" y2="19" stroke="#10b981" stroke-width="1"/>
    </g>
    
    <!-- Lock icon for sensitive data -->
    <g transform="translate(-5, 45)">
      <rect x="5" y="12" width="18" height="14" rx="2" fill="#10b981" opacity="0.4" stroke="#10b981" stroke-width="1.5"/>
      <path d="M8,12 L8,9 Q8,3 14,3 Q20,3 20,9 L20,12" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="14" cy="18" r="2" fill="#10b981"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#34d399">Datos</text>
    
    <!-- Description -->
    <text x="0" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Información sensible,</text>
    <text x="0" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">archivos críticos</text>
    
    <!-- Tags -->
    <g transform="translate(0, 165)">
      <rect x="-55" y="0" width="110" height="20" rx="10" fill="#10b981" opacity="0.2"/>
      <text x="0" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">Tipo, ubicación</text>
    </g>
  </g>
  
  <!-- Bottom decorative line -->
  <line x1="50" y1="380" x2="1150" y2="380" stroke="url(#hardwareGrad)" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Corner accents -->
  <circle cx="30" cy="30" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="1170" cy="30" r="4" fill="#10b981" opacity="0.4"/>
  <circle cx="30" cy="370" r="4" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="1170" cy="370" r="4" fill="#06b6d4" opacity="0.4"/>
</svg>