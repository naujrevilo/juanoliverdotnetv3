<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g stroke="#22d3ee" stroke-opacity="0.1" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
  </g>
  
  <!-- Circuit lines left side -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M50,315 L120,315 L150,285 L200,285"/>
    <path d="M50,350 L100,350 L130,380 L180,380 L210,350 L260,350"/>
    <path d="M50,280 L90,280 L120,250 L160,250"/>
    <circle cx="200" cy="285" r="4" fill="#22d3ee"/>
    <circle cx="180" cy="380" r="4" fill="#22d3ee"/>
    <circle cx="160" cy="250" r="4" fill="#22d3ee"/>
  </g>
  
  <!-- Central database/inventory icon -->
  <g transform="translate(200, 230)" filter="url(#glow)">
    <!-- Database cylinder -->
    <ellipse cx="100" cy="30" rx="70" ry="25" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <path d="M30,30 L30,150 Q30,175 100,175 Q170,175 170,150 L170,30" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <ellipse cx="100" cy="100" rx="70" ry="20" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <ellipse cx="100" cy="150" rx="70" ry="25" fill="none" stroke="#22d3ee" stroke-width="3"/>
    
    <!-- Inventory tags -->
    <rect x="50" y="55" width="100" height="20" rx="3" fill="#22d3ee" opacity="0.3"/>
    <rect x="50" y="120" width="100" height="20" rx="3" fill="#a78bfa" opacity="0.3"/>
    
    <!-- Checkmarks -->
    <path d="M85,65 L95,75 L120,50" stroke="#22d3ee" stroke-width="3" fill="none"/>
    <path d="M85,130 L95,140 L120,115" stroke="#a78bfa" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Surrounding icons -->
  <!-- Laptop -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="50" height="35" rx="3" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <rect x="5" y="5" width="40" height="25" fill="#a78bfa" opacity="0.2"/>
    <path d="M-5,35 L55,35 L50,45 L0,45 Z" fill="none" stroke="#a78bfa" stroke-width="2"/>
  </g>
  
  <!-- Cloud -->
  <g transform="translate(310, 100)">
    <path d="M30,50 Q10,50 10,35 Q10,20 25,20 Q30,5 50,5 Q70,5 75,20 Q90,20 90,35 Q90,50 70,50 Z" fill="#22d3ee" opacity="0.3" stroke="#22d3ee" stroke-width="2"/>
  </g>
  
  <!-- Shield -->
  <g transform="translate(70, 420)">
    <path d="M30,0 L60,10 L60,35 Q60,60 30,70 Q0,60 0,35 L0,10 Z" fill="#a78bfa" opacity="0.3" stroke="#a78bfa" stroke-width="2"/>
    <path d="M20,30 L28,38 L45,20" stroke="#a78bfa" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Server rack -->
  <g transform="translate(320, 400)">
    <rect x="0" y="0" width="40" height="60" rx="3" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <line x1="0" y1="15" x2="40" y2="15" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#22d3ee" stroke-width="1"/>
    <line x1="0" y1="45" x2="40" y2="45" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="32" cy="7" r="3" fill="#22d3ee"/>
    <circle cx="32" cy="22" r="3" fill="#22d3ee"/>
    <circle cx="32" cy="37" r="3" fill="#a78bfa"/>
    <circle cx="32" cy="52" r="3" fill="#22d3ee"/>
  </g>
  
  <!-- License/doc icon -->
  <g transform="translate(180, 450)">
    <rect x="0" y="0" width="35" height="45" rx="2" fill="#a78bfa" opacity="0.3" stroke="#a78bfa" stroke-width="2"/>
    <line x1="5" y1="12" x2="30" y2="12" stroke="#a78bfa" stroke-width="2"/>
    <line x1="5" y1="22" x2="25" y2="22" stroke="#a78bfa" stroke-width="2"/>
    <line x1="5" y1="32" x2="20" y2="32" stroke="#a78bfa" stroke-width="2"/>
  </g>
  
  <!-- Gear -->
  <g transform="translate(300, 200)">
    <circle cx="25" cy="25" r="15" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="25" cy="25" r="8" fill="#22d3ee" opacity="0.3"/>
    <g stroke="#22d3ee" stroke-width="4">
      <line x1="25" y1="0" x2="25" y2="8"/>
      <line x1="25" y1="42" x2="25" y2="50"/>
      <line x1="0" y1="25" x2="8" y2="25"/>
      <line x1="42" y1="25" x2="50" y2="25"/>
    </g>
  </g>
  
  <!-- Connection lines to icons -->
  <g stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4" opacity="0.3">
    <line x1="130" y1="137" x2="200" y2="200"/>
    <line x1="345" y1="125" x2="300" y2="200"/>
    <line x1="100" y1="445" x2="150" y2="380"/>
    <line x1="345" y1="430" x2="300" y2="380"/>
    <line x1="205" y1="470" x2="220" y2="400"/>
  </g>
  
  <!-- Accent bar -->
  <rect x="420" y="180" width="8" height="270" fill="url(#accent)" rx="4"/>
  
  <!-- Title area -->
  <g transform="translate(450, 200)">
    <!-- Category tag -->
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#22d3ee" opacity="0.2"/>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22d3ee">ITAM</text>
    
    <!-- Main title -->
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="white">
      <tspan x="0" dy="0">Inventario de</tspan>
      <tspan x="0" dy="45">Activos IT</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="140" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Gestión y optimización
    </text>
    <text x="0" y="170" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#22d3ee">
      con ITIL v4
    </text>
    
    <!-- Decorative dots -->
    <circle cx="0" cy="200" r="4" fill="#22d3ee"/>
    <circle cx="15" cy="200" r="4" fill="#a78bfa"/>
    <circle cx="30" cy="200" r="4" fill="#22d3ee" opacity="0.5"/>
  </g>
  
  <!-- Bottom decorative elements -->
  <g transform="translate(450, 500)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="3" fill="#22d3ee"/>
    <circle cx="100" cy="0" r="3" fill="#a78bfa"/>
    <circle cx="200" cy="0" r="3" fill="#22d3ee" opacity="0.5"/>
  </g>
  
  <!-- Floating particles -->
  <g fill="#22d3ee" opacity="0.4">
    <circle cx="100" cy="550" r="2"/>
    <circle cx="250" cy="580" r="1.5"/>
    <circle cx="380" cy="560" r="2"/>
    <circle cx="150" cy="590" r="1"/>
  </g>
  <g fill="#a78bfa" opacity="0.4">
    <circle cx="350" cy="570" r="1.5"/>
    <circle cx="280" cy="555" r="2"/>
    <circle cx="120" cy="565" r="1"/>
  </g>
</svg>